[package]
name = "quantumforge"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
llvm = []
cuda = []

[[bench]]
name = "cuda_batch"
path = "benches/cuda_batch.rs"
harness = false
required-features = ["cuda"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "core"
path = "benches/core.rs"
harness = false

