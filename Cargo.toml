[package]
name = "quantumforge"
version = "0.2.9"
edition = "2024"
rust-version = "1.88"
description = "A Rust quantum simulation toolkit: exact-rational analytic core, CPU/CUDA circuit simulation, tensor networks (MPS/TEBD/DMRG), QEC codes, VQE/QML with four gradient strategies and shot-aware adaptive observation control, MPS and parameter-transfer QAOA, MBQC, adiabatic QC, and unitary Turing machines."
license = "Apache-2.0"
repository = "https://github.com/Junshenhuang-571/QuantumForge"
documentation = "https://docs.rs/quantumforge"
readme = "README.md"
default-run = "qf"
autobins = false
keywords = ["quantum", "simulation", "quantum-computing", "vqe", "cuda"]
categories = ["science", "simulation", "hardware-support"]
exclude = ["dist/*", "wheeltest*/", "__pycache__/", "**/*.pyc", "target/pkg/*", "fuzz/*"]

[lib]
crate-type = ["lib", "cdylib"]

[workspace]
members = ["."]
# The fuzzing crate is a separate workspace: it needs nightly and
# libfuzzer-sys, and it must not be pulled into `cargo test --workspace` or
# into the published tarball.
exclude = ["fuzz"]
resolver = "2"

[[bin]]
name = "quantumforge"
path = "src/bin/quantumforge.rs"

# Keep the previously published target name available for scripts that invoke
# `CARGO_BIN_EXE_main`; new users should use the descriptive `quantumforge` name.
[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "qf"
path = "src/bin/qf.rs"

[features]
default = ["rayon"]
llvm = []
cuda = []
gpu = ["cudarc", "cudarc/cuda-12040"]
python = ["pyo3"]
rayon = ["dep:rayon"]
ibm = ["reqwest"]
ionq = ["reqwest"]
rigetti = ["reqwest"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faer = "0.24"
num-complex = "0.4"
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py38"] }
reqwest = { version = "0.12", optional = true, features = ["json", "rustls-tls"] }
cudarc = { version = "0.12", optional = true, features = ["std", "cublas", "driver", "nvrtc", "dynamic-linking"] }
rayon = { version = "1.10", optional = true }

[[bench]]
name = "cuda_batch"
path = "benches/cuda_batch.rs"
harness = false
required-features = ["cuda"]

[[bench]]
name = "core"
path = "benches/core.rs"
harness = false

# Python package config
[package.metadata.docs.rs]
# CUDA and GPU are excluded because cudarc probes for CUDA toolkit headers at
# build time; docs.rs runners do not provide a CUDA toolkit. GPU APIs remain
# documented in source and are compile-checked on configured developer hosts.
features = ["rayon", "llvm", "python", "ibm", "ionq", "rigetti"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.maturin]
# Build separate wheels for each feature combination
# maturin build --features default     -> quantumforge (CPU only)
# maturin build --features cuda        -> quantumforge (with CUDA)
# maturin build --features llvm        -> quantumforge (with LLVM)
# maturin build --features full        -> quantumforge (all)
