[package]
name = "quantumforge"
version = "0.2.1"
edition = "2024"
description = "A small, backend-neutral quantum simulation kernel: CPU, CUDA, and LLVM backends with gate-model circuits, VQE/QML, MBQC, adiabatic QC, and unitary Turing machines."
license = "GPL-3.0"
repository = "https://github.com/Junshenhuang-571/QuantumForge"
homepage = "https://github.com/Junshenhuang-571/QuantumForge"
documentation = "https://docs.rs/quantumforge"
readme = "README.md"
keywords = ["quantum", "simulation", "quantum-computing", "vqe", "cuda"]
categories = ["science", "simulation", "hardware-support"]

[lib]
crate-type = ["lib", "cdylib"]

[workspace]
members = ["."]
resolver = "2"

[features]
default = []
llvm = []
cuda = []
python = ["pyo3"]
ibm = ["reqwest"]
ionq = ["reqwest"]
rigetti = ["reqwest"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.23", optional = true, features = ["extension-module", "abi3-py38"] }
reqwest = { version = "0.12", optional = true, features = ["json", "rustls-tls"] }

[[bench]]
name = "cuda_batch"
path = "benches/cuda_batch.rs"
harness = false
required-features = ["cuda"]

[[bench]]
name = "core"
path = "benches/core.rs"
harness = false

# Python package config
[package.metadata.maturin]
# Build separate wheels for each feature combination
# maturin build --features default     -> quantumforge (CPU only)
# maturin build --features cuda        -> quantumforge (with CUDA)
# maturin build --features llvm        -> quantumforge (with LLVM)
# maturin build --features full        -> quantumforge (all)
