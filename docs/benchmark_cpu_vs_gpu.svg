<rect x="400" y="20" width="12" height="12" fill="#7c6af7"/>
<text x="418" y="30" font-size="10" fill="#aaa">CPU (DMRG)</text>
<text x="400" y="50" font-size="9" fill="#666">GPU: --features gpu (sparse Lanczos)</text>
