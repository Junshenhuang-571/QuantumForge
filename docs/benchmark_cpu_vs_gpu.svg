<text x="15" y="180" text-anchor="middle" font-size="12" fill="#aaa" transform="rotate(-90,15,180)">Time (ms, log scale)</text>
<line x1="60" y1="300" x2="540" y2="300" stroke="#333" stroke-width="1"/>
<text x="60" y="315" text-anchor="middle" font-size="10" fill="#888">6</text>
<text x="200" y="315" text-anchor="middle" font-size="10" fill="#888">8</text>
<text x="340" y="315" text-anchor="middle" font-size="10" fill="#888">10</text>
<text x="480" y="315" text-anchor="middle" font-size="10" fill="#888">12</text>
<polyline points="60,260 200,180 340,60" fill="none" stroke="#7c6af7" stroke-width="2.5"/>
<circle cx="60" cy="260" r="5" fill="#7c6af7"/>
<circle cx="200" cy="180" r="5" fill="#7c6af7"/>
<circle cx="340" cy="60" r="5" fill="#7c6af7"/>
<text x="70" y="255" font-size="9" fill="#7c6af7">41 ms</text>
<text x="210" y="175" font-size="9" fill="#7c6af7">719 ms</text>
<text x="350" y="55" font-size="9" fill="#7c6af7">23.4 s</text>
