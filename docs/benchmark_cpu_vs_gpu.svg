<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" style="background:#0f0f1a;font-family:sans-serif">
<text x="300" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#e0e0ff">QuantumForge DMRG: CPU Time vs System Size</text>
