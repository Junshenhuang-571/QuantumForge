[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin.BuildBackend"

[project]
name = "quantumforge"
version = "0.2.0"
description = "Exact-rational quantum simulation kernel: CPU, CUDA, LLVM backends with circuits, VQE, MBQC, AQC, QTM, QEC, tensor networks"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [{name = "Junshen Huang", email = "junshenhuangc@126.com"}]
repository = "https://github.com/Junshenhuang-571/QuantumForge"
documentation = "https://docs.rs/quantumforge"
keywords = ["quantum", "simulation", "quantum-computing", "vqe", "cuda", "mps", "qec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.maturin]
features = ["pyo3", "extension-module"]
manylinux = "2014"

[project.optional-dependencies]
cuda = []
llvm = []

