name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Test workspace
        run: cargo test --workspace --lib --tests --verbose

      - name: Build docs
        run: cargo doc --workspace --no-deps --verbose

  # The crate declares rust-version = "1.88" (what the full workspace, including the
  # proptest dev-dependency, actually compiles on). This job
  # proves the workspace still compiles on the declared MSRV so users on older
  # toolchains get a working build rather than cryptic errors.
  msrv:
    name: msrv / rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile on MSRV
        run: cargo check --workspace --all-targets

  # Feature-gated code paths (llvm, python, provider backends) are not exercised
  # by the default-feature test matrix above. CUDA/GPU need an external toolkit
  # and are intentionally excluded. These jobs prove the code compiles under
  # each feature combination.
  feature-compile:
    name: compile / ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - llvm
          - python
          - rayon
          # Neither CUDA feature is covered here: cudarc's build script probes
          # for `include/cuda.h` at build time, so `gpu` needs the toolkit
          # headers even though it loads the driver dynamically at runtime.
          # `cuda` additionally links libcuda. Both must be compiled locally.
          - ibm
          - ionq
          - rigetti
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy with features
        run: cargo clippy --no-default-features --features "${{ matrix.features }}" --lib -- -D warnings

  # Supply-chain check: cargo-audit scans Cargo.lock against the RustSec
  # advisory database. Kept as its own job so a new advisory does not fail the
  # formatting/clippy jobs.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        # The binary lives in the cached ~/.cargo/bin, which a previous
        # interrupted run may have restored only partially — `cargo install`
        # then refuses to overwrite it. Skip the install when it is present.
        run: |
          if command -v cargo-audit >/dev/null 2>&1; then
            echo "cargo-audit already installed: $(cargo audit --version)"
          else
            cargo install cargo-audit --locked
          fi

      - name: Audit dependencies
        # Two pyo3 advisories (RUSTSEC-2025-0020, RUSTSEC-2026-0177) are ignored
        # deliberately: the patched releases require pyo3 >= 0.29, which needs
        # the unstable `cfg_select` feature and therefore a newer compiler than
        # this crate's declared MSRV (1.88). Revisit when the MSRV moves.
        run: >-
          cargo audit
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0177

  # The Python bindings are a published artifact (PyPI wheels), so they need an
  # end-to-end check rather than a compile check: build a wheel, install it into
  # a clean venv, then run the smoke test, the binding-surface drift test and
  # the worked examples. The tests run from a neutral directory on purpose --
  # running them from the checkout root would let a stray `quantumforge/`
  # directory shadow the installed wheel.
  python-bindings:
    name: python wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The steps below use POSIX syntax and POSIX-style venv paths
    # (.venv-wheeltest/bin/python), but Windows defaults `run` to PowerShell,
    # where a quoted command followed by -m is a parse error.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv-python: .venv-wheeltest/bin/python
          - os: windows-latest
            venv-python: .venv-wheeltest/Scripts/python.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install maturin
        # Pinned: newer maturin mis-detects bindings on a pyo3+abi3 crate and
        # tries to generate cffi declarations, which fails inside CI containers.
        run: python -m pip install --quiet 'maturin==1.12.6'

      - name: Build wheel
        # --auditwheel skip: this job installs the wheel into a venv on the
        # runner itself to test the bindings. It is not producing a
        # distributable artifact -- the publish workflow builds those inside a
        # manylinux container. The audit rejects a host-glibc build outright
        # (offending GLIBC_2.39 symbols on ubuntu-latest).
        run: maturin build --release --features python -o dist --auditwheel skip

      - name: Install wheel into a clean venv
        run: |
          python -m venv .venv-wheeltest
          "${{ matrix.venv-python }}" -m pip install --quiet --upgrade pip
          "${{ matrix.venv-python }}" -m pip install --quiet dist/*.whl

      - name: Import from the checkout root
        # Regression guard for the shadowing bug: a `quantumforge/` directory
        # at the repository root takes precedence over the installed wheel for
        # any interpreter with the checkout on sys.path, so a bare
        # `import quantumforge` fails with
        # "No module named quantumforge.quantumforge". The shim now lives under
        # python/, so the import must resolve into site-packages.
        run: >-
          "${{ matrix.venv-python }}" -c "import quantumforge;
          assert 'site-packages' in quantumforge.__file__, quantumforge.__file__;
          print('root import OK:', quantumforge.__file__)"

      - name: Run binding tests from a neutral directory
        run: |
          mkdir -p wheeltest-neutral
          cp python/smoke_test.py python/test_exports.py python/test_api.py wheeltest-neutral/
          cp python/examples/*.py wheeltest-neutral/
          cd wheeltest-neutral
          "$GITHUB_WORKSPACE/${{ matrix.venv-python }}" smoke_test.py
          "$GITHUB_WORKSPACE/${{ matrix.venv-python }}" test_api.py
          "$GITHUB_WORKSPACE/${{ matrix.venv-python }}" test_exports.py "$GITHUB_WORKSPACE/python/API.md"
          for script in bell qec vqe; do
            "$GITHUB_WORKSPACE/${{ matrix.venv-python }}" "$script.py"
          done

  # Benchmarks are compiled but not run in CI: a full `cargo bench` campaign is
  # far beyond a CI budget, but a bench target that no longer compiles would
  # otherwise go unnoticed. This proves the bench tree still builds.
  benches:
    name: cargo bench (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Compile benchmarks
        run: cargo bench --no-run

  # Fuzz targets for the two parsers that accept untrusted input: the circuit
  # DSL and OpenQASM. Only compiled here, not run -- a campaign needs hours of
  # CPU and belongs in a scheduled job. libfuzzer-sys needs a nightly compiler.
  fuzz:
    name: fuzz targets (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: cargo fuzz build

  # Module-level coverage gate. Line coverage says how much of a module is
  # exercised; this says whether a module is exercised AT ALL. `stabilizer` had
  # no test file referencing it and shipped seven bugs, four of them silent
  # wrong answers. The script is a proxy (a mention is not an assertion) but it
  # catches the zero case cheaply, and it is why tests/module_coverage.rs exists.
  module-coverage:
    name: module test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every public module is exercised
        run: python scripts/module_test_coverage.py --fail
