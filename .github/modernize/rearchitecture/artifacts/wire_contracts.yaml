contracts:
  - name: qasm-import-export
    unit: core-circuit-runtime
    type: file
    stability: must_preserve
    source_loc: "src/qasm.rs:1"
    contract:
      method: "QASM parse/export"
      path: "src/qasm.rs"
      request: "gate definitions and circuit expressions"
      response: "Rust Circuit object or serialized QASM form"
      error: "ParseError or unsupported gate formats"
      auth: "none"
    target_contract:
      method: "CircuitFromQasm(input: &str) -> Result<Circuit, ParseError>"
      notes: "Retain the same parse semantics and error handling contract in any target implementation."
    semantic_divergence:
      - field: "gate notation"
        issue: "QASM and internal gate names can diverge if aliases are normalized differently."
        source_loc: "src/qasm.rs:1"

  - name: cli-repl-dispatch
    unit: cli-repl
    type: cli
    stability: frozen
    source_loc: "src/bin/qf.rs:213"
    contract:
      method: "Session.dispatch"
      path: "qf> <command>"
      request: "command keyword and argument string"
      response: "state mutation, text output, or exit signal"
      error: "unknown command message or parse error"
      auth: "none"
    target_contract:
      method: "dispatch(command: &str, rest: &str) -> bool"
      notes: "The interactive loop must preserve the same command vocabulary and exit semantics."
    semantic_divergence:
      - field: "command names"
        issue: "REPL commands are user-driven text contracts; parser compatibility matters more than object-level type purity."
        source_loc: "src/bin/qf.rs:213"

  - name: hardware-job-api
    unit: hardware-backends
    type: sdk
    stability: must_preserve
    source_loc: "src/hardware.rs:30"
    contract:
      method: "submit_job"
      path: "provider-specific job queue"
      request: "OpenQASM circuit, shot count, metadata, seed"
      response: "JobHandle and eventual JobResults"
      error: "QuantumError::UnsupportedOperation or Timeout"
      auth: "provider credential"
    target_contract:
      method: "submit_job(job: &JobRequest) -> Result<JobHandle>"
      notes: "The provider-agnostic contract stays stable even if the underlying cloud API changes."
    semantic_divergence:
      - field: "retry and timeout"
        issue: "Different providers implement job polling and error semantics differently; behavior must remain provider-neutral at the library boundary."
        source_loc: "src/hardware.rs:30"

  - name: python-binding-surface
    unit: python-bindings
    type: sdk
    stability: must_preserve
    source_loc: "src/python.rs:1"
    contract:
      method: "PyCircuit / PyStateVector / PyTEBD"
      path: "Python extension module"
      request: "Python-native inputs to the Rust core"
      response: "Python-exposed objects and values"
      error: "Python-typed exceptions mapped from QuantumError"
      auth: "none"
    target_contract:
      method: "python extension exports for Circuit, StateVector, and simulator objects"
      notes: "The extension contract should mirror the Rust library semantics without changing the Python object model."
    semantic_divergence:
      - field: "Python numerics"
        issue: "Python users expect floats and arrays; native Rust types must be normalized to Python-friendly representations."
        source_loc: "src/python.rs:1"
