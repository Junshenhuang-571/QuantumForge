unit: tensor-network-runtime
side_effects:
  - source_loc: "src/tensor_network.rs:131"
    effect: "creates and mutates tensor-network state for large-system simulation"
    must_preserve: true
  - source_loc: "src/tensor_network.rs:215"
    effect: "performs SVD and normalization for bond-dimension truncation"
    must_preserve: true
branches:
  - source_loc: "src/tensor_network.rs:260"
    condition: "whether a matrix is processed with exact diagonalization or sparse Lanczos"
    behavior: "switches execution strategy based on system size and available backend"
    must_preserve: true
error_paths:
  - source_loc: "src/tensor_network.rs:101"
    trigger: "matrix decomposition or invalid tensor shape"
    outcome: "returns a fall-back or invalid-shape error path"
    contract: "tensor shape and decomposition validation"
    must_preserve: true
concurrency:
  model: sync
  tx_boundary:
    source_loc: "src/tensor_network.rs:215"
    scope: "local tensor contraction and canonicalization steps"
    isolation: "in-memory numerical work"
    must_preserve: true
