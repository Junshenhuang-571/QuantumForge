unit: aqc-annealing
side_effects:
  - source_loc: "src/aqc.rs:1"
    effect: "constructs an adiabatic schedule between driver and problem Hamiltonians"
    must_preserve: true
branches:
  - source_loc: "src/aqc.rs:38"
    condition: "selected interpolation path such as linear, fast, or polynomial"
    behavior: "changes the annealing trajectory while preserving the end-state objective"
    must_preserve: true
error_paths:
  - source_loc: "src/aqc.rs:52"
    trigger: "invalid annealing configuration"
    outcome: "returns an adiabatic error or configuration error"
    contract: "schedule validation failure"
    must_preserve: true
concurrency:
  model: sync
  tx_boundary:
    source_loc: "src/aqc.rs:38"
    scope: "one schedule evaluation and state update"
    isolation: "local in-memory schedule"
    must_preserve: true
