unit: python-bindings
bindings:
  - type: di-registration
    name: "PyO3 module exports"
    source_loc: "src/python.rs:1"
    target: "Python extension module"
    must_appear_in_target: true
    notes: "The extension must expose the same computational objects to Python users."
runtime_config:
  - key: "pyo3 / maturin"
    source_loc: "Cargo.toml:24"
    source: "build-config"
    default_value: "disabled unless feature python is enabled"
    must_appear_in_target: true
    notes: "Python binding availability is controlled by build-time feature flags."
