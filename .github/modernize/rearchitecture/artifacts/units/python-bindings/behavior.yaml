unit: python-bindings
side_effects:
  - source_loc: "src/python.rs:1"
    effect: "wraps existing Rust core objects into Python-visible classes and returns Python-native values"
    must_preserve: true
branches:
  - source_loc: "src/python.rs:20"
    condition: "whether the extension exposes a circuit, state, or algorithm object"
    behavior: "routes to the matching Python wrapper while preserving the underlying Rust semantics"
    must_preserve: true
error_paths:
  - source_loc: "src/python.rs:30"
    trigger: "Rust-side runtime error during conversion or validation"
    outcome: "propagates a Python-level exception or conversion error"
    contract: "Python-bound exceptions from the underlying QuantumError"
    must_preserve: true
concurrency:
  model: sync
  tx_boundary:
    source_loc: "src/python.rs:1"
    scope: "single Python call crossing the FFI boundary"
    isolation: "native boundary call"
    must_preserve: true
