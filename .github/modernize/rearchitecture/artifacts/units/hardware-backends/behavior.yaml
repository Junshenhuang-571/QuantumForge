unit: hardware-backends
side_effects:
  - source_loc: "src/hardware.rs:30"
    effect: "submits job requests to a remote provider and records metadata"
    must_preserve: true
branches:
  - source_loc: "src/hardware.rs:27"
    condition: "whether a backend is a simulator or a real device"
    behavior: "changes job execution mode and response validation"
    must_preserve: true
error_paths:
  - source_loc: "src/hardware.rs:39"
    trigger: "unsupported provider operation or request timeout"
    outcome: "returns a QuantumError::UnsupportedOperation or Timeout"
    contract: "provider-neutral job failure contract"
    must_preserve: true
concurrency:
  model: async
  tx_boundary:
    source_loc: "src/hardware.rs:54"
    scope: "provider polling and asynchronous job completion"
    isolation: "networked job lifecycle"
    must_preserve: true
