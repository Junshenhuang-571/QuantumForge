units:
  - name: cli-repl
    trigger: cli
    trigger_detail: "qf interactive shell in src/bin/qf.rs"
    source_anchors:
      - path: src/bin/qf.rs
        line: 1
    exported_signature:
      - method: "Session.dispatch(line: &str) -> bool"
        source_loc: "src/bin/qf.rs:213"
        stability: must_preserve
    dynamic_entrypoints: []
    depends_on:
      - unit: core-circuit-runtime
        via: "StateVector, Circuit, Gate, ParameterizedCircuit"
    shared_refs:
      - module: core-quantum-state
        used_fields:
          - StateVector
          - Circuit
          - Gate
      - module: parser-serialization
        used_fields:
          - parse_circuit
          - SerializedCircuit

  - name: core-circuit-runtime
    trigger: api
    trigger_detail: "public Rust library API exposed by src/lib.rs"
    source_anchors:
      - path: src/lib.rs
        line: 1
      - path: src/parser.rs
        line: 1
      - path: src/quantum.rs
        line: 1
      - path: src/analytic.rs
        line: 1
    exported_signature:
      - method: "StateVector::zero(qubits: usize) -> Result<Self, QuantumError>"
        source_loc: "src/lib.rs:204"
        stability: frozen
      - method: "Circuit::new() -> Self"
        source_loc: "src/lib.rs:456"
        stability: must_preserve
      - method: "parse_circuit(input: &str) -> Result<Circuit, ParseError>"
        source_loc: "src/parser.rs:1"
        stability: must_preserve
    dynamic_entrypoints: []
    depends_on: []
    shared_refs:
      - module: core-quantum-state
        used_fields:
          - Complex64
          - StateVector
          - DensityMatrix
          - Circuit
          - Gate
      - module: parser-serialization
        used_fields:
          - SerializedCircuit
          - SerializedOp

  - name: variational-qml
    trigger: api
    trigger_detail: "parameterized VQE and QML execution paths"
    source_anchors:
      - path: src/algorithms.rs
        line: 1
      - path: src/optimizer.rs
        line: 1
    exported_signature:
      - method: "qaoa_maxcut(num_qubits: usize, edges: &[(usize, usize, f64)], p: usize, betas: &[f64], gammas: &[f64]) -> Circuit"
        source_loc: "src/algorithms.rs:47"
        stability: must_preserve
      - method: "VariationalQnn::train(...)"
        source_loc: "src/lib.rs:904"
        stability: must_preserve
    dynamic_entrypoints: []
    depends_on:
      - unit: core-circuit-runtime
        via: "Circuit and gate application"
    shared_refs:
      - module: core-quantum-state
        used_fields:
          - Circuit
          - StateVector
          - QuantumError
      - module: backend-interfaces
        used_fields:
          - HardwareBackend

