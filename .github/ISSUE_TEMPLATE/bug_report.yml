name: Bug report
description: Report a reproducible QuantumForge problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please include a minimal reproduction and avoid posting secrets or private data."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the full relevant error output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or minimal reproduction
      description: Include the smallest Rust, Python, or REPL example that reproduces the issue.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuantumForge version
      placeholder: "e.g. 0.2.4 or git commit"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: features
    attributes:
      label: Enabled features
      description: List Cargo features, Python extras, or write "default".
      placeholder: "default"
    validations:
      required: true
